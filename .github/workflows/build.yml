name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libglib2.0-dev libudev-dev qt6-base-dev qt6-declarative-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Check installation
        run: |
          DESTDIR="$RUNNER_TEMP/dynis-install" cmake --install build
          test -f "$RUNNER_TEMP/dynis-install/usr/share/dynis/IslandGlassCarrier.qml"
          test -f "$RUNNER_TEMP/dynis-install/usr/share/dynis/WorkspaceIslandWindow.qml"
